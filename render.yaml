services:
  - type: web
    name: invoicepilot
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AGENT_SECRET
        sync: false
      - key: AGENT_ENABLED
        value: "true"
      - key: AGENT_MAX_ACTIONS
        value: "5"
      - key: PAYPAL_BASE
        value: https://api-m.sandbox.paypal.com
      - key: AI_MODEL
        value: qwen/qwen3.8-27b
      - key: FX_USD_INR
        value: "92"
